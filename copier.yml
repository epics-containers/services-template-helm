_message_before_copy: |
  This template will create a new repository which describes the Kubernetes configuration for IOC and service instances. Each repository represents a group of IOCs and services that are deployed to *the same cluster* and the *same namespace*. The grouping can be arbitrary, e.g. by beamline, location, technical area, maintainer etc.

_message_after_copy: |
  🎉 For detailed information about each service, refer to the documentation in their respective folders.
_min_copier_version: "9.3.0"

_subdirectory: "template"

_preserve_symlinks: true

# Generated once, then owned by the repo: 'copier update' never overwrites a
# path here that already exists on disk. CODEOWNERS lives in the repo root.
_skip_if_exists:
  - "CODEOWNERS"

domain:
  type: str
  help: |
    The domain for this collection of IOCs and service.

       At DLS this should be the short beamline name or the short technical area
       for accelerator repos.

  placeholder: e.g. "i16", "b01-1", "p47", "va", "rf"
  validator: >-
    {% if not (domain | regex_search('^[a-zA-Z][a-zA-Z-0-9]+$')) %}
    {{domain}} must be alphanumeric plus hyphens and start with a letter.
    {% endif %}

description:
  type: str
  help: A One line description of the module
  default: >-
    {{ domain }} IOC Instances and Services

location:
  type: str
  help: |
    Default location where these IOCs and services will run.

      At DLS this should blxxi for beamlines or one of srxxc, brxxc, linac for the accelerator
  placeholder: e.g. "bl21i" "bl16b" "bl01c" "sr03c" "linac"
  validator: >-
    {% if not (location | regex_search('^[a-zA-Z][a-zA-Z0-9]+$')) %}
    {{ location }} must be alphanumeric and start with a letter
    {% endif %}

cluster_name:
  type: str
  help: |
    The Kubernetes cluster where the IOCs and services will run.

       At DLS this should be "k8s-{beamline shortname}", "acastus" for the
       accelerator or "pollux" for test beamlines.
  placeholder: e.g. "k8s-i16", "k8s-b01-1", "pollux", "acastus"
  validator: >-
    {% if not (cluster_name | regex_search('^[a-z][a-z-0-9]+$')) %}
    {{cluster_name}} must be lower case alphanumeric and start with a letter,
    it may contain hyphens
    {% endif %}

cluster_namespace:
  type: str
  help: |
    Kubernetes namespace in which the IOCs and services will run.

       At DLS this should be "{beamline shortname}-beamline" or "accelerator".
  placeholder: e.g. "i16-beamline", "b01-1-beamline", "p47-beamline", "accelerator"
  validator: >-
    {% if not (cluster_namespace | regex_search('^[a-z][a-z-0-9]+$')) %}
    {{cluster_namespace}} must be lower case alphanumeric and start with a letter,
    it may contain hyphens
    {% endif %}

git_platform:
  type: str
  help: |
    Git platform hosting this repository.

       To add to this list make a PR to services-template-helm.
  choices:
    - github.com
    - gitlab.diamond.ac.uk

dls_technical_area:
  type: str
  help: The DLS gitlab subfolder for this repo.
  when: >-
    {{ git_platform == 'gitlab.diamond.ac.uk' }}
  choices:
    - beamline
    - accelerator

gateway:
  help: Deploy an EPICS gateway to allow traffic from pods without hostNetwork. 
  # the default must match 'when': a question copier does not ask still gets
  # its default, so a bare 'true' here gives accelerator repos a gateway
  default: "{{ location.startswith('bl') }}"
  type: bool
  when: >-
    {{ location.startswith('bl') }}
  
athena_services:
  help: |
    Athena services to be included in this repository. Leave blank if not applicable.

       These (and the three questions that follow) are the defaults for every
       instrument; the "instruments" question can override them per instrument.
  default: []
  type: str
  multiselect: true
  choices:
    - rabbitmq
    - blueapi
    - nexus

auth_enabled:
  help: Enable authentication for blueapi? (Required for Numtracker integration)
  default: False
  type: bool
  when: >-
    {{ "blueapi" in athena_services }}

numtracker_enabled:
  help: Enable Numtracker integration for blueapi and NeXus service. Requires authentication using identity.diamond.ac.uk
  default: False
  type: bool
  when: >-
    {{ auth_enabled }}

tiled_enabled:
  help: Enable tiled insertion for blueapi.
  default: False
  type: bool
  when: >-
    {{ auth_enabled }}

# Replaces the single 'instrument' question. On 'copier update' of a repo made
# before this question existed, its old 'instrument' answer is still in the
# answers file and seeds the default, so the existing services are kept.
instruments:
  type: yaml
  multiline: true
  help: |
    A YAML list of the instruments (beamlines or endstations) to deploy Athena services for.

       Each name is used in the "NXInstrument" in produced NeXus files (if enabled)
       and as a prefix for the names of services to ensure uniqueness.
       Typically we use the instrument short name, e.g. "i22", "b16", "i03-1", "SWIFT".

       An entry is either a name, which gets the services and settings answered above,
       or a mapping with a "name" plus any of "athena_services", "auth_enabled",
       "numtracker_enabled" and "tiled_enabled" to override them for that instrument.
       e.g. [i15, i15-1]
            [i10, {name: i10-1, athena_services: [blueapi], auth_enabled: false}]

       The first instrument keeps the unprefixed secret names (blueapi-secret,
       rabbitmq-secrets); the others prefix them with the instrument name so that
       they do not clash in the shared namespace.
  default: >-
    {{ [instrument if instrument is defined else domain] | tojson }}
  validator: >-
    {%- set keys = ["name", "athena_services", "auth_enabled", "numtracker_enabled", "tiled_enabled"] -%}
    {%- if instruments is string or instruments is mapping or instruments is not iterable -%}
    instruments must be a list, e.g. [{{ domain }}]
    {%- elif instruments | length == 0 -%}
    instruments must name at least one instrument
    {%- else -%}
    {%- set ns = namespace(names=[]) -%}
    {%- for item in instruments -%}
    {%- set name = item.get("name") if item is mapping else item -%}
    {%- if not (name is string and name | regex_search('^[a-zA-Z][a-zA-Z-0-9]+$')) %}
    instrument name {{ name }} must be alphanumeric plus hyphens and start with a letter.
    {%- endif -%}
    {%- if name in ns.names %}
    instrument {{ name }} is listed more than once.
    {%- endif -%}
    {%- set ns.names = ns.names + [name] -%}
    {%- if item is mapping -%}
    {%- for key in item if key not in keys %}
    instrument {{ name }}: unknown key {{ key }}, expected one of {{ keys | join(", ") }}.
    {%- endfor -%}
    {%- for service in item.get("athena_services", []) if service not in ["rabbitmq", "blueapi", "nexus"] %}
    instrument {{ name }}: unknown Athena service {{ service }}.
    {%- endfor -%}
    {%- endif -%}
    {%- endfor -%}
    {%- endif -%}
  when: >-
    {{ athena_services != [] }}

# Computed, never asked or stored: one mapping per instrument with the
# overrides from 'instruments' applied over the defaults above, plus a flag per
# service for the templates' '{% yield inst %}' folder names to select on.
instrument_configs:
  type: yaml
  when: false
  default: >-
    {%- set ns = namespace(out=[]) -%}
    {%- for item in (instruments if athena_services != [] else []) -%}
    {%- set cfg = item if item is mapping else {"name": item} -%}
    {%- set services = cfg.get("athena_services", athena_services) -%}
    {%- set auth = "blueapi" in services and cfg.get("auth_enabled", auth_enabled) -%}
    {%- set ns.out = ns.out + [{
      "name": cfg.name,
      "rabbitmq": "rabbitmq" in services,
      "blueapi": "blueapi" in services,
      "nexus": "nexus" in services,
      "auth_enabled": auth,
      "numtracker_enabled": auth and cfg.get("numtracker_enabled", numtracker_enabled),
      "tiled_enabled": auth and cfg.get("tiled_enabled", tiled_enabled),
      "secret_prefix": "" if loop.first else cfg.name ~ "-",
    }] -%}
    {%- endfor -%}
    {{ ns.out | tojson }}

logging_url:
  type: str
  help: URL for centralized logging. Leave blank if not applicable.
  choices:
    Skip: ""
    DLS GrayLog: https://graylog2.diamond.ac.uk/search?rangetype=relative&fields=message%2Csource&width=1489&highlightMessage=&relative=172800&q=pod_name%3A{service_name}*
  default: https://graylog2.diamond.ac.uk/search?rangetype=relative&fields=message%2Csource&width=1489&highlightMessage=&relative=172800&q=pod_name%3A{service_name}*
