name: Test template

on:
  push:
  pull_request:

jobs:
  render:
    # render the template with each answers file and run the generated CI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        answers:
          - beamline-github
          - beamline-gitlab
          - accelerator-gitlab

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # copier reads the template version from the latest tag
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Render and verify
        run: bash tests/test_template.sh tests/answers/${{ matrix.answers }}.yml
